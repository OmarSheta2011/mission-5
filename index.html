<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>tocket calculator</title>
  </head>
  <body>
    <form>
      <div class="input-field">
        <label for="name">Full Name</label>
        <input id="name" type="text" placeholder="Full Name" />
      </div>
      <div class="input-field">
        <label for="age">Age</label>
        <input id="age" type="number" placeholder="Age" />
      </div>
      <div class="input-field">
        <label for="type">Ticket Type</label>
        <select name="" id="type">
          <option value="Standard">Standard: 100 EGP</option>
          <option value="VIP">VIP: 180 EGP</option>
        </select>
      </div>
      <div class="input-field">
        <label for="quantity">Quantity</label
        ><select name="" id="quantity">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>
      <div class="input-field">
        <label for="promo-code">Promo Code</label>
        <input re id="promo-code" type="text" placeholder="Promo Code" />
      </div>
      <div class="buttons-wrraper">
        <input type="submit" class="submit-btn" value="Submit" />
        <input type="reset" class="reset-btn" value="Reset" />
      </div>
    </form>
    <div class="ticket"><p>please fill in the form</p></div>
    <script src="script.js"></script>
  </body>
</html>
